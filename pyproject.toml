[project]
name = "invoice-match-mcp"
version = "0.1.0"
description = "Small MCP server that three-way-matches supplier invoices against purchase orders, with a deterministic rule engine and an eval suite."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
invoice-match-mcp = "invoice_match.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]